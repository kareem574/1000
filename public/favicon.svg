<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="favChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f8fafc" />
      <stop offset="40%" stopColor="#94a3b8" />
      <stop offset="80%" stopColor="#334155" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="favRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ff1744" />
      <stop offset="50%" stopColor="#e11d48" />
      <stop offset="100%" stopColor="#881337" />
    </linearGradient>
    <linearGradient id="favFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="60%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#000" floodOpacity="0.4" />
    </filter>
  </defs>

  <!-- Dark rounded background for crisp contrast -->
  <rect width="100" height="100" rx="22" fill="#0f172a" />
  <rect width="96" height="96" x="2" y="2" rx="20" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.6" />

  <g transform="translate(4, 8) scale(0.92)" filter="url(#glow)">
    <!-- Speed Exhaust Flame -->
    <path
      d="M 68 28 C 76 18, 86 21, 94 25 C 87 29, 85 33, 92 36 C 82 38, 75 42, 66 36 Z"
      fill="url(#favFlame)"
    />

    <!-- Front Chrome Wheel with EL -->
    <circle cx="28" cy="52" r="18" fill="none" stroke="url(#favChrome)" stroke-width="5.5" />
    <circle cx="28" cy="52" r="12" fill="#1e293b" />
    <text
      x="28"
      y="57"
      font-family="Arial, sans-serif"
      font-weight="900"
      font-size="13"
      fill="#f8fafc"
      text-anchor="middle"
      letter-spacing="-0.5"
    >
      EL
    </text>

    <!-- Motorcycle Body Frame -->
    <path
      d="M 20 44 L 38 18 L 56 30 L 68 20 L 75 32 L 58 36 L 68 46 L 50 42 L 36 60 L 26 48 Z"
      fill="url(#favChrome)"
      stroke="#e2e8f0"
      stroke-width="1"
    />

    <!-- Rear Speed Ring -->
    <path
      d="M 62 44 A 16 16 0 1 1 82 66"
      fill="none"
      stroke="#e11d48"
      stroke-width="3.5"
      stroke-dasharray="3 1.5"
    />

    <!-- ZZ Monogram in Red Ruby -->
    <g>
      <!-- First Z -->
      <path
        d="M 50 49 L 68 49 L 56 68 L 70 68 L 68 74 L 48 74 L 60 55 L 50 55 Z"
        fill="url(#favRed)"
        stroke="#fff"
        stroke-width="0.5"
      />
      <!-- Second Z -->
      <path
        d="M 68 49 L 86 49 L 74 68 L 88 68 L 86 74 L 66 74 L 78 55 L 68 55 Z"
        fill="url(#favRed)"
        stroke="#fff"
        stroke-width="0.5"
      />
    </g>

    <!-- Arabic Subtitle -->
    <text
      x="50"
      y="88"
      font-family="'Cairo', sans-serif"
      font-weight="800"
      font-size="9"
      fill="#ffffff"
      text-anchor="middle"
    >
      العز اكسبريس
    </text>
  </g>
</svg>
